name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Types
        run: mypy

      - name: Unit tests
        run: pytest -m "not integration and not live and not evals" --cov=procurement --cov-report=term-missing

  integration:
    # Отдельная задача: этим тестам нужен Docker, они поднимают настоящие
    # PostgreSQL и ClickHouse через testcontainers и идут заметно дольше.
    # На ubuntu-раннере GitHub Docker уже есть, ставить ничего не надо.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Integration tests
        run: pytest -m integration -v

  evals:
    # Качество поиска по документам — без языковой модели, поэтому бесплатно и
    # на каждый пуш. Нужны Docker (pgvector) и модель эмбеддингов: ~1.1 ГБ,
    # держим в кэше, иначе каждая сборка качала бы её заново.
    runs-on: ubuntu-latest
    env:
      PA_ASSISTANT__RAG__MODEL_CACHE_DIR: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-paraphrase-multilingual-mpnet-base-v2

      - name: Retrieval evals
        run: pytest -m evals -s

      - name: Report
        if: always()
        run: |
          if [ -f evals/reports/retrieval-ci.md ]; then cat evals/reports/retrieval-ci.md >> "$GITHUB_STEP_SUMMARY"; fi
