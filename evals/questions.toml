[[question]]
id = "data-hhi-max-2025"
kind = "data"
text = "Какое наибольшее значение индекса Херфиндаля среди заказчиков, у которых не меньше пяти поставщиков, за 2025 год?"
# Независимый пересчёт, а не тот же запрос, что в API: эталон, совпадающий с
# проверяемым кодом символ в символ, ошибку в нём не поймает.
gold_sql = """
SELECT max(hhi) FROM (
    SELECT customer_bin, round(sum(pow(100 * s / t, 2))) AS hhi, count() AS n
    FROM (
        SELECT customer_bin, supplier_biin, toFloat64(sum(contract_sum)) AS s,
               sum(toFloat64(sum(contract_sum))) OVER (PARTITION BY customer_bin) AS t
        FROM contracts FINAL
        WHERE crdate >= '2025-01-01' AND crdate < '2026-01-01'
        GROUP BY customer_bin, supplier_biin
    )
    GROUP BY customer_bin
    HAVING n >= 5
)
"""
tolerance = 0.002
expected_tools = ["customer_concentration", "run_sql"]

