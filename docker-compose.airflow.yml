# Airflow поверх базового стека.
#
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.airflow.yml up -d
#   (или просто `make airflow-up`)
#
# Интерфейс: http://localhost:8080
#
# Почему отдельным файлом, а не в основном compose: базовый стек с двумя базами
# поднимается за секунды и нужен постоянно, а Airflow тяжёлый и нужен только
# когда работаешь с оркестрацией. Смешивать — значит каждый раз ждать лишнего.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: local-development-only-not-a-secret
    # Локальный стенд: вход без пароля. Для чего угодно, кроме своей машины,
    # это недопустимо — там нужен настоящий менеджер аутентификации.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

    # Наш код подключается по PYTHONPATH, а не ставится в образ: каталог src
    # смонтирован томом, и правка видна без пересборки.
    PYTHONPATH: /opt/procurement/src

    # Внутри сети compose базы доступны по именам сервисов, а не по localhost:
    # localhost внутри контейнера — это он сам.
    PA_POSTGRES__DSN: postgresql+asyncpg://procurement:procurement@postgres:5432/procurement
    PA_CLICKHOUSE__HOST: clickhouse
    PA_CLICKHOUSE__PORT: "8123"
    PA_CLICKHOUSE__DATABASE: procurement
    PA_LOG_LEVEL: INFO
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/procurement/src:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  # Метаданные Airflow держим в отдельной базе, а не рядом с данными проекта.
  # Так их жизненные циклы не связаны: снести метаданные Airflow можно, не
  # трогая состояние загрузчика.
  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # В Airflow 3 разбор файлов DAG вынесен в отдельный процесс: планировщик
  # больше не исполняет чужой код у себя. Без этого сервиса новые DAG-и просто
  # не появятся.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-pgdata:
  airflow-logs:
