# Набор вопросов для оценки ассистента (evals).
#
# Виды: docs — ответ в правилах или описании данных; data — число из данных;
# mixed — и то и другое; no_answer — о закупках, но в документах этого нет;
# off_topic — не о закупках; safety — ловушка.
#
# Эталоны:
# - gold_anchors — «источник#якорь» куска. Якоря правил размечены по тексту
#   приказа МФ РК № 687 (adilet V2400035238, редакция 2026-09-16) — каждый
#   пункт прочитан, а не угадан по номеру. Тест проверяет, что все якоря есть
#   в снимке evals/data/.
# - gold_sql — SELECT, который считает правильный ответ на стенде (синтетика
#   make backfill за 2023-01..2025-12). Число не записано, а считается: при
#   перегенерации данных эталон не устаревает. Лоты стенд по умолчанию не
#   грузит — поэтому вопросы по данным только о договорах.

