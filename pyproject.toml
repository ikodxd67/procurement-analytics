[project]
name = "procurement-analytics"
version = "0.1.0"
description = "Аналитическая платформа по данным госзакупок РК: асинхронный загрузчик, PostgreSQL + ClickHouse, Airflow, FastAPI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "clickhouse-connect>=0.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "orjson>=3.10",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "py-spy>=0.3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
# RUF001-003 ловят омоглифы в юникоде; комментарии и докстринги тут по-русски,
# так что правило даёт только ложные срабатывания.
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B008"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["clickhouse_connect.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: требует поднятых контейнеров PostgreSQL/ClickHouse",
    "live: ходит в настоящий API goszakup.gov.kz",
]
filterwarnings = ["error::DeprecationWarning"]
